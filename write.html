<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="DevLog 게시글 작성 및 편집 에디터">
  <title>새 글 작성 | DevLog</title>
  
  <!-- Fonts & Icons -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ==================== Header / Navbar ==================== -->
  <header id="header" class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="nav-logo">
        <span class="logo-accent">&lt;</span>Dev.Log<span class="logo-accent">/&gt;</span>
      </a>

      <!-- Navigation Links -->
      <nav class="nav-menu" id="nav-menu">
        <ul class="nav-list">
          <li><a href="index.html" class="nav-link">홈</a></li>
          <li><a href="posts.html" class="nav-link">게시글</a></li>
          <li><a href="about.html" class="nav-link">소개</a></li>
          <li><a href="skills.html" class="nav-link">기술</a></li>
          <li><a href="projects.html" class="nav-link">프로젝트</a></li>
        </ul>
      </nav>

      <!-- Auth & Actions -->
      <div class="nav-actions">
        <div id="nav-auth-container" class="nav-auth-container">
          <!-- Dynamically populated by blog-core.js -->
        </div>
        <button id="theme-toggle" class="btn-icon" aria-label="테마 전환" title="테마 변경">
          <i class="fa-solid fa-moon"></i>
        </button>
        <button id="mobile-menu-btn" class="btn-icon hamburger" aria-label="메뉴 열기" title="메뉴 열기">
          <i class="fa-solid fa-bars"></i>
        </button>
      </div>
    </div>
  </header>

  <main class="page-main">
    <div class="write-container">

      <div class="editor-card">
        <!-- Editor Header Bar -->
        <div class="editor-header-bar">
          <div style="display: flex; align-items: center; gap: 10px;">
            <a href="posts.html" class="btn btn-outline btn-sm" title="돌아가기">
              <i class="fa-solid fa-arrow-left"></i>
            </a>
            <h1 style="font-size: 1.3rem; font-weight: 700; margin: 0;" id="editor-page-title">새 글 작성</h1>
          </div>
          <div style="display: flex; align-items: center; gap: 8px;">
            <div id="autosave-status" class="autosave-status-pill" title="자동 임시저장 상태">
              <i class="fa-solid fa-cloud"></i> <span>작성 대기</span>
            </div>
            <button type="button" id="btn-load-draft" class="btn btn-outline btn-sm" title="임시저장된 글 불러오기">
              <i class="fa-solid fa-clock-rotate-left"></i> 불러오기
            </button>
            <button type="button" id="btn-clear-draft" class="btn btn-outline btn-sm" title="임시저장 비우기" style="display: none; color: #ef4444;">
              <i class="fa-regular fa-trash-can"></i>
            </button>
          </div>
        </div>

        <!-- Draft Alert Banner (이전에 작성 중이던 임시저장 글 발견 시 노출) -->
        <div id="draft-alert-banner" class="draft-alert-banner" style="display: none;">
          <div class="draft-alert-content">
            <i class="fa-solid fa-file-circle-check draft-icon"></i>
            <div class="draft-text-box">
              <strong>이전에 작성 중이던 임시저장 글이 있습니다.</strong>
              <span id="draft-saved-time" class="draft-saved-time"></span>
            </div>
          </div>
          <div class="draft-actions">
            <button type="button" id="btn-restore-draft" class="btn btn-sm btn-primary">
              <i class="fa-solid fa-clock-rotate-left"></i> 복원하기
            </button>
            <button type="button" id="btn-discard-draft" class="btn btn-sm btn-outline" title="임시저장 삭제 후 새로 작성">
              새로 쓰기
            </button>
          </div>
        </div>

        <!-- Author Status & Login Guidance Bar -->
        <div id="author-status-bar" style="margin-bottom: 18px;"></div>

        <form id="write-form" novalidate>
          <!-- Title Input -->
          <input 
            type="text" 
            id="post-title" 
            class="editor-title-input" 
            placeholder="제목을 입력하세요..." 
            required 
          />

          <!-- Category & Tags Grid -->
          <div class="editor-meta-grid">
            <div>
              <select id="post-category" class="editor-category-select" required>
                <option value="frontend" data-name="프론트엔드">프론트엔드 (Frontend)</option>
                <option value="css" data-name="CSS & UI">CSS & UI</option>
                <option value="backend" data-name="백엔드 & CS">백엔드 & CS</option>
                <option value="performance" data-name="성능 최적화">성능 최적화</option>
                <option value="devlife" data-name="개발 이야기">개발 이야기</option>
              </select>
            </div>
            <div>
              <input 
                type="text" 
                id="post-tags" 
                class="editor-input" 
                placeholder="태그를 쉼표(,)로 구분하여 입력 (예: React, TypeScript, 최적화)" 
              />
            </div>
          </div>

          <!-- Cover Image Input (Optional) -->
          <div style="margin-bottom: 14px;">
            <input 
              type="url" 
              id="post-cover" 
              class="editor-input" 
              placeholder="커버 이미지 URL (선택사항, 미입력 시 멋진 개발 테마 기본 이미지가 적용됩니다)" 
            />
          </div>

          <!-- Options: Featured Post Checkbox -->
          <div style="margin-bottom: 20px; display: flex; align-items: center; gap: 8px; font-size: 0.88rem; color: var(--text-muted);">
            <input type="checkbox" id="post-featured" style="cursor: pointer; width: 16px; height: 16px;" />
            <label for="post-featured" style="cursor: pointer; user-select: none;">
              <i class="fa-solid fa-star" style="color: #f59e0b;"></i> 메인 페이지 대표(Featured) 추천 글로 등록
            </label>
          </div>

          <!-- Editor Toolbar -->
          <div class="editor-toolbar">
            <button type="button" class="toolbar-btn" data-tool="h2" title="큰 제목 (H2)"><i class="fa-solid fa-heading"></i></button>
            <button type="button" class="toolbar-btn" data-tool="h3" title="중간 제목 (H3)"><i class="fa-solid fa-h"></i></button>
            <div class="toolbar-divider"></div>
            <button type="button" class="toolbar-btn" data-tool="bold" title="굵게"><i class="fa-solid fa-bold"></i></button>
            <button type="button" class="toolbar-btn" data-tool="italic" title="기울임"><i class="fa-solid fa-italic"></i></button>
            <div class="toolbar-divider"></div>
            <button type="button" class="toolbar-btn" data-tool="quote" title="인용문"><i class="fa-solid fa-quote-left"></i></button>
            <button type="button" class="toolbar-btn" data-tool="code" title="코드 블록"><i class="fa-solid fa-code"></i></button>
            <button type="button" class="toolbar-btn" data-tool="list" title="글머리 기호"><i class="fa-solid fa-list-ul"></i></button>
            <button type="button" class="toolbar-btn" data-tool="link" title="링크 추가"><i class="fa-solid fa-link"></i></button>
            <button type="button" class="toolbar-btn" data-tool="hr" title="구분선"><i class="fa-solid fa-minus"></i></button>

            <!-- Mode Tabs (Edit vs Preview) -->
            <div class="editor-tab-nav">
              <button type="button" class="editor-tab-btn active" id="tab-write-btn">
                <i class="fa-solid fa-pen"></i> 작성
              </button>
              <button type="button" class="editor-tab-btn" id="tab-preview-btn">
                <i class="fa-regular fa-eye"></i> 미리보기
              </button>
            </div>
          </div>

          <!-- Textarea (Write) -->
          <textarea 
            id="post-content" 
            class="editor-textarea" 
            placeholder="마크다운(Markdown) 문법을 지원합니다. 자유롭게 당신의 개발 인사이트와 코드를 작성해 보세요...

## 주요 구현 내용
- 핵심 개념 설명
- 실무 적용 팁

```javascript
const greet = 'Hello DevLog!';
console.log(greet);
```" 
            required
          ></textarea>

          <!-- Preview Pane -->
          <div id="post-preview-pane" class="editor-preview-pane post-detail-content">
            <!-- Rendered preview markdown -->
          </div>

          <!-- Footer Actions -->
          <div class="editor-footer-actions">
            <button type="button" id="btn-save-draft" class="btn btn-outline">
              <i class="fa-regular fa-floppy-disk"></i> 임시저장
            </button>
            <a href="posts.html" class="btn btn-outline">
              취소
            </a>
            <button type="submit" id="btn-publish-post" class="btn btn-primary">
              <i class="fa-solid fa-paper-plane"></i> 게시하기
            </button>
          </div>
        </form>
      </div>

    </div>
  </main>

  <footer class="footer">
    <div class="container footer-container">
      <div class="footer-logo">
        <span class="logo-accent">&lt;</span>Dev.Log<span class="logo-accent">/&gt;</span>
      </div>
      <p class="footer-copy">&copy; 2024 DevLog. All rights reserved.</p>
    </div>
  </footer>

  <div id="toast" class="toast"></div>

  <!-- Scripts -->
  <script src="js/blog-data.js"></script>
  <script src="js/blog-core.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const editPostId = urlParams.get('edit');

      const titleInput = document.getElementById('post-title');
      const categorySelect = document.getElementById('post-category');
      const tagsInput = document.getElementById('post-tags');
      const coverInput = document.getElementById('post-cover');
      const contentTextarea = document.getElementById('post-content');
      const previewPane = document.getElementById('post-preview-pane');
      const featuredCheckbox = document.getElementById('post-featured');

      const tabWriteBtn = document.getElementById('tab-write-btn');
      const tabPreviewBtn = document.getElementById('tab-preview-btn');
      const writeForm = document.getElementById('write-form');
      const btnSaveDraft = document.getElementById('btn-save-draft');
      const btnLoadDraft = document.getElementById('btn-load-draft');
      const btnClearDraft = document.getElementById('btn-clear-draft');
      const btnPublishPost = document.getElementById('btn-publish-post');
      const pageTitle = document.getElementById('editor-page-title');

      // 자동 임시저장 및 복원 알림 요소
      const autosaveStatus = document.getElementById('autosave-status');
      const draftAlertBanner = document.getElementById('draft-alert-banner');
      const draftSavedTime = document.getElementById('draft-saved-time');
      const btnRestoreDraft = document.getElementById('btn-restore-draft');
      const btnDiscardDraft = document.getElementById('btn-discard-draft');

      // 작성자 계정 안내 바 렌더링
      const authorBar = document.getElementById('author-status-bar');
      const currentUser = BlogCore.Auth.getCurrentUser();
      if (authorBar) {
        if (currentUser) {
          authorBar.innerHTML = `
            <div style="display: flex; align-items: center; gap: 10px; font-size: 0.88rem; color: var(--text-main); background: var(--bg-alt); padding: 10px 16px; border-radius: var(--radius-md); border: 1px solid var(--border-color);">
              <img src="${currentUser.avatar || 'assets/images/profile.jpg'}" alt="작성자" style="width: 24px; height: 24px; border-radius: 50%; object-fit: cover; border: 1.5px solid var(--primary);">
              <span><strong>${currentUser.nickname || currentUser.name}</strong> 님의 계정으로 글이 발행됩니다.</span>
            </div>
          `;
        } else {
          authorBar.innerHTML = `
            <div style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; font-size: 0.88rem; color: var(--text-muted); background: var(--bg-alt); padding: 10px 16px; border-radius: var(--radius-md); border: 1px solid var(--border-color);">
              <div style="display: flex; align-items: center; gap: 8px;">
                <i class="fa-solid fa-circle-info" style="color: var(--primary);"></i>
                <span>현재 비로그인 상태입니다. 게스트(익명)로 작성하거나 로그인 후 등록하실 수 있습니다.</span>
              </div>
              <a href="login.html?redirect=write.html" class="btn btn-sm btn-outline" style="padding: 4px 12px; font-size: 0.82rem;">
                <i class="fa-solid fa-arrow-right-to-bracket"></i> 로그인하기
              </a>
            </div>
          `;
        }
      }

      // 폼 데이터 수집 헬퍼
      function collectFormData() {
        return {
          title: titleInput.value,
          category: categorySelect.value,
          tags: tagsInput.value,
          cover: coverInput.value,
          content: contentTextarea.value,
          featured: featuredCheckbox ? featuredCheckbox.checked : false
        };
      }

      // 폼 데이터 채우기 헬퍼
      function applyFormData(data) {
        if (!data) return;
        if (data.title !== undefined) titleInput.value = data.title;
        if (data.category !== undefined) categorySelect.value = data.category;
        if (data.tags !== undefined) tagsInput.value = data.tags;
        if (data.cover !== undefined) coverInput.value = data.cover;
        if (data.content !== undefined) contentTextarea.value = data.content;
        if (data.featured !== undefined && featuredCheckbox) featuredCheckbox.checked = !!data.featured;
      }

      // 임시저장 상태 뱃지 업데이트
      function updateAutosaveBadge(state, timeStr = '') {
        if (!autosaveStatus) return;
        if (state === 'saving') {
          autosaveStatus.className = 'autosave-status-pill saving';
          autosaveStatus.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> <span>저장 중...</span>';
        } else if (state === 'saved') {
          autosaveStatus.className = 'autosave-status-pill saved';
          autosaveStatus.innerHTML = `<i class="fa-solid fa-check"></i> <span>${timeStr || '자동 저장됨'}</span>`;
        } else {
          autosaveStatus.className = 'autosave-status-pill';
          autosaveStatus.innerHTML = '<i class="fa-solid fa-cloud"></i> <span>작성 대기</span>';
        }
      }

      // 상단 비우기 버튼 노출 제어
      function updateDraftUiButtons() {
        const hasDraft = BlogCore.Draft.hasDraft();
        if (btnClearDraft) {
          btnClearDraft.style.display = hasDraft ? 'inline-flex' : 'none';
        }
      }

      // 실시간 자동 저장 (디바운스 800ms)
      let autosaveTimeout = null;
      function triggerAutosave() {
        if (editPostId) return; // 기존 발행글 수정 중일 때는 임시저장 덮어쓰지 않음
        const currentData = collectFormData();
        if (!currentData.title.trim() && !currentData.content.trim()) {
          updateAutosaveBadge('idle');
          return;
        }

        updateAutosaveBadge('saving');
        clearTimeout(autosaveTimeout);
        autosaveTimeout = setTimeout(() => {
          const draft = BlogCore.Draft.save(currentData);
          if (draft) {
            updateAutosaveBadge('saved', `${draft.displayTime} 저장됨`);
            updateDraftUiButtons();
          }
        }, 800);
      }

      // 입력 이벤트 리스너 바인딩 (실시간 자동 임시저장)
      titleInput.addEventListener('input', triggerAutosave);
      contentTextarea.addEventListener('input', triggerAutosave);
      tagsInput.addEventListener('input', triggerAutosave);
      coverInput.addEventListener('input', triggerAutosave);
      categorySelect.addEventListener('change', triggerAutosave);
      if (featuredCheckbox) featuredCheckbox.addEventListener('change', triggerAutosave);

      // 수정 모드일 때 기존 데이터 불러오기
      if (editPostId) {
        const existingPost = BlogCore.Post.getById(editPostId);
        if (existingPost) {
          pageTitle.textContent = '게시글 수정';
          document.title = '게시글 수정 | DevLog';
          titleInput.value = existingPost.title || '';
          categorySelect.value = existingPost.category || 'frontend';
          tagsInput.value = (existingPost.tags || []).join(', ');
          coverInput.value = existingPost.coverImage || '';
          if (featuredCheckbox) featuredCheckbox.checked = !!existingPost.featured;
          contentTextarea.value = existingPost.content || '';
          if (btnPublishPost) btnPublishPost.innerHTML = '<i class="fa-solid fa-check"></i> 수정 완료';
        }
      } else {
        // 새 글 작성 모드: 기존 임시저장 글 감지 시 복원 배너 표시
        if (BlogCore.Draft.hasDraft()) {
          const draft = BlogCore.Draft.get();
          if (draft) {
            if (draftAlertBanner) draftAlertBanner.style.display = 'flex';
            if (draftSavedTime) draftSavedTime.textContent = `(최근 저장: ${draft.displayTime || new Date(draft.savedAt).toLocaleTimeString()})`;
            updateDraftUiButtons();
          }
        }
      }

      // 복원하기 배너 버튼 클릭
      if (btnRestoreDraft) {
        btnRestoreDraft.addEventListener('click', () => {
          const draft = BlogCore.Draft.get();
          if (draft) {
            applyFormData(draft);
            if (draftAlertBanner) draftAlertBanner.style.display = 'none';
            updateAutosaveBadge('saved', `${draft.displayTime || ''} 복원됨`);
            BlogCore.showToast('임시저장 내용을 성공적으로 복원했습니다.', 'success');
          }
        });
      }

      // 새로 쓰기(임시저장 삭제) 배너 버튼 클릭
      if (btnDiscardDraft) {
        btnDiscardDraft.addEventListener('click', () => {
          if (confirm('임시저장된 글을 삭제하고 새로 작성하시겠습니까?')) {
            BlogCore.Draft.clear();
            if (draftAlertBanner) draftAlertBanner.style.display = 'none';
            updateDraftUiButtons();
            updateAutosaveBadge('idle');
            BlogCore.showToast('임시저장 내용이 삭제되었습니다.', 'info');
          }
        });
      }

      // 상단 임시저장 불러오기 버튼 클릭
      if (btnLoadDraft) {
        btnLoadDraft.addEventListener('click', () => {
          const draft = BlogCore.Draft.get();
          if (!draft || (!draft.title && !draft.content)) {
            BlogCore.showToast('저장된 임시 글이 없습니다.', 'info');
            return;
          }

          if (confirm(`[${draft.displayTime || ''}] 임시저장된 내용을 불러오시겠습니까?\n현재 입력한 내용은 대체됩니다.`)) {
            applyFormData(draft);
            if (draftAlertBanner) draftAlertBanner.style.display = 'none';
            updateAutosaveBadge('saved', `${draft.displayTime || ''} 복원됨`);
            BlogCore.showToast('임시저장 내용을 성공적으로 불러왔습니다.', 'success');
          }
        });
      }

      // 상단 임시저장 비우기 버튼 클릭
      if (btnClearDraft) {
        btnClearDraft.addEventListener('click', () => {
          if (confirm('임시저장된 글을 완전히 비우시겠습니까?')) {
            BlogCore.Draft.clear();
            if (draftAlertBanner) draftAlertBanner.style.display = 'none';
            updateDraftUiButtons();
            updateAutosaveBadge('idle');
            BlogCore.showToast('임시저장이 비워졌습니다.', 'info');
          }
        });
      }

      // 하단 수동 임시저장 버튼 클릭
      if (btnSaveDraft) {
        btnSaveDraft.addEventListener('click', () => {
          const currentData = collectFormData();
          const draft = BlogCore.Draft.save(currentData);
          if (draft) {
            updateAutosaveBadge('saved', `${draft.displayTime} 저장됨`);
            updateDraftUiButtons();
            BlogCore.showToast(`[${draft.displayTime}] 임시저장 완료!`, 'success');
          }
        });
      }

      // 탭 전환 (작성 vs 미리보기)
      tabWriteBtn.addEventListener('click', () => {
        tabWriteBtn.classList.add('active');
        tabPreviewBtn.classList.remove('active');
        contentTextarea.style.display = 'block';
        previewPane.classList.remove('active');
      });

      tabPreviewBtn.addEventListener('click', () => {
        tabPreviewBtn.classList.add('active');
        tabWriteBtn.classList.remove('active');
        contentTextarea.style.display = 'none';
        previewPane.classList.add('active');

        // Render preview
        const rawContent = contentTextarea.value.trim() || '*작성된 내용이 없습니다.*';
        previewPane.innerHTML = BlogCore.parseSimpleMarkdown(rawContent);
      });

      // 툴바 버튼 핸들러
      const toolbarButtons = document.querySelectorAll('.toolbar-btn[data-tool]');
      toolbarButtons.forEach(btn => {
        btn.addEventListener('click', () => {
          const tool = btn.getAttribute('data-tool');
          insertFormatting(tool);
        });
      });

      function insertFormatting(tool) {
        const start = contentTextarea.selectionStart;
        const end = contentTextarea.selectionEnd;
        const selected = contentTextarea.value.substring(start, end);
        let replacement = '';

        switch (tool) {
          case 'h2':
            replacement = `\n## ${selected || '소제목'}\n`;
            break;
          case 'h3':
            replacement = `\n### ${selected || '세부 제목'}\n`;
            break;
          case 'bold':
            replacement = `**${selected || '굵은 텍스트'}**`;
            break;
          case 'italic':
            replacement = `*${selected || '기울임 텍스트'}*`;
            break;
          case 'quote':
            replacement = `\n> ${selected || '인용할 문장'}\n`;
            break;
          case 'code':
            replacement = `\n\`\`\`javascript\n${selected || '// 코드를 여기에 작성하세요'}\n\`\`\`\n`;
            break;
          case 'list':
            replacement = `\n- ${selected || '목록 아이템 1'}\n- 목록 아이템 2\n`;
            break;
          case 'link':
            replacement = `[${selected || '링크 텍스트'}](https://)`;
            break;
          case 'hr':
            replacement = `\n---\n`;
            break;
        }

        contentTextarea.setRangeText(replacement, start, end, 'end');
        contentTextarea.focus();
        triggerAutosave();
      }

      // 폼 제출 (게시하기 - 초고속 즉시 등록)
      writeForm.addEventListener('submit', (e) => {
        e.preventDefault();

        const title = titleInput.value.trim();
        const content = contentTextarea.value.trim();
        const category = categorySelect.value;
        const selectedOpt = categorySelect.options[categorySelect.selectedIndex];
        const categoryName = selectedOpt.getAttribute('data-name') || selectedOpt.text;
        const tags = tagsInput.value.split(',').map(s => s.trim()).filter(Boolean);
        const coverImage = coverInput.value.trim();

        if (!title) {
          BlogCore.showToast('게시글 제목을 입력해 주세요.', 'error');
          titleInput.focus();
          return;
        }

        if (!content) {
          BlogCore.showToast('본문 내용을 입력해 주세요.', 'error');
          contentTextarea.focus();
          return;
        }

        const isFeatured = featuredCheckbox ? featuredCheckbox.checked : false;

        const postPayload = {
          title,
          category,
          categoryName,
          tags: tags.length > 0 ? tags : ['Dev'],
          coverImage: coverImage || 'https://images.unsplash.com/photo-1555066931-4365d14bab8c?q=80&w=1200&auto=format&fit=crop',
          featured: isFeatured,
          content
        };

        // 버튼 비활성화 및 즉시 로딩 표시
        if (btnPublishPost) {
          btnPublishPost.disabled = true;
          btnPublishPost.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 게시 중...';
        }

        if (editPostId) {
          // 수정
          const updated = BlogCore.Post.update(editPostId, postPayload);
          if (updated) {
            BlogCore.Draft.clear();
            BlogCore.showToast('게시글이 성공적으로 수정되었습니다!', 'success');
            setTimeout(() => {
              window.location.href = `post-detail.html?id=${updated.id}`;
            }, 250);
          } else {
            if (btnPublishPost) {
              btnPublishPost.disabled = false;
              btnPublishPost.innerHTML = '<i class="fa-solid fa-paper-plane"></i> 게시하기';
            }
          }
        } else {
          // 신규 작성 (0ms 즉시 스토리지 기록)
          const newPost = BlogCore.Post.create(postPayload);
          BlogCore.Draft.clear();
          BlogCore.showToast('새 게시글이 성공적으로 등록되었습니다!', 'success');
          setTimeout(() => {
            window.location.href = `post-detail.html?id=${newPost.id}`;
          }, 250);
        }
      });
    });
  </script>
</body>
</html>
