<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="DevLog 기술 게시글 전체 목록 - 웹 개발, 아키텍처, 성능 최적화, 개발 이야기">
  <title>게시글 목록 | DevLog</title>
  
  <!-- Fonts & Icons -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ==================== Header / Navbar ==================== -->
  <header id="header" class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="nav-logo">
        <span class="logo-accent">&lt;</span>Dev.Log<span class="logo-accent">/&gt;</span>
      </a>

      <!-- Navigation Links -->
      <nav class="nav-menu" id="nav-menu">
        <ul class="nav-list">
          <li><a href="index.html" class="nav-link">홈</a></li>
          <li><a href="posts.html" class="nav-link active">게시글</a></li>
          <li><a href="about.html" class="nav-link">소개</a></li>
          <li><a href="skills.html" class="nav-link">기술</a></li>
          <li><a href="projects.html" class="nav-link">프로젝트</a></li>
        </ul>
      </nav>

      <!-- Auth & Actions -->
      <div class="nav-actions">
        <div id="nav-auth-container" class="nav-auth-container">
          <!-- Dynamically populated by blog-core.js -->
        </div>
        <button id="theme-toggle" class="btn-icon" aria-label="테마 전환" title="테마 변경">
          <i class="fa-solid fa-moon"></i>
        </button>
        <button id="mobile-menu-btn" class="btn-icon hamburger" aria-label="메뉴 열기" title="메뉴 열기">
          <i class="fa-solid fa-bars"></i>
        </button>
      </div>
    </div>
  </header>

  <main class="page-main">
    <!-- Page Header Banner -->
    <section class="page-banner">
      <div class="container" style="display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 16px;">
        <div>
          <span class="section-subtitle">Articles & Notes</span>
          <h1 class="page-title">전체 게시글</h1>
          <p class="page-subtitle">실무 경험, 신기술 리뷰, 문제 해결 과정을 담은 개발 기록들입니다.</p>
        </div>
        <div>
          <a href="write.html" class="btn btn-primary">
            <i class="fa-solid fa-pen-nib"></i> 새 글 작성하기
          </a>
        </div>
      </div>
    </section>

    <!-- Posts Section -->
    <section class="section" style="padding-top: 24px;">
      <div class="container">

        <!-- Search & Filter Controls -->
        <div class="blog-filter-bar">
          <div class="search-box-wrap">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input 
              type="text" 
              id="search-input" 
              class="search-input" 
              placeholder="제목, 내용, 태그로 검색해 보세요..."
            />
          </div>

          <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap;">
            <select id="sort-select" class="sort-select" aria-label="게시글 정렬">
              <option value="latest">최신순</option>
              <option value="popular">인기순 (조회수)</option>
              <option value="likes">좋아요순</option>
            </select>
          </div>
        </div>

        <!-- Category Filter Tabs -->
        <div class="category-tabs" id="category-tabs" style="margin-bottom: 28px;">
          <button class="category-tab-btn active" data-category="all">전체보기</button>
          <button class="category-tab-btn" data-category="frontend">프론트엔드</button>
          <button class="category-tab-btn" data-category="css">CSS & UI</button>
          <button class="category-tab-btn" data-category="backend">백엔드 & CS</button>
          <button class="category-tab-btn" data-category="performance">성능 최적화</button>
          <button class="category-tab-btn" data-category="devlife">개발 이야기</button>
        </div>

        <!-- Posts Count Info -->
        <div style="margin-bottom: 18px; font-size: 0.9rem; color: var(--text-muted); display: flex; justify-content: space-between;">
          <span>총 <strong id="total-count-text" style="color: var(--primary);">0</strong>개의 글</span>
        </div>

        <!-- Posts Grid -->
        <div class="posts-grid" id="posts-grid">
          <!-- Populated by JavaScript -->
        </div>

        <!-- Pagination Controls -->
        <div class="pagination-container" id="pagination-container">
          <!-- Populated by JavaScript -->
        </div>

      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer-container">
      <div class="footer-logo">
        <span class="logo-accent">&lt;</span>Dev.Log<span class="logo-accent">/&gt;</span>
      </div>
      <p class="footer-copy">&copy; 2024 DevLog. All rights reserved.</p>
    </div>
  </footer>

  <div id="toast" class="toast"></div>

  <!-- Scripts -->
  <script src="js/blog-data.js"></script>
  <script src="js/blog-core.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      let currentCategory = 'all';
      let searchQuery = '';
      let currentSort = 'latest';
      let currentPage = 1;
      const postsPerPage = 6;

      const postsGrid = document.getElementById('posts-grid');
      const searchInput = document.getElementById('search-input');
      const sortSelect = document.getElementById('sort-select');
      const categoryTabs = document.querySelectorAll('#category-tabs .category-tab-btn');
      const totalCountText = document.getElementById('total-count-text');
      const paginationContainer = document.getElementById('pagination-container');

      // URL 파라미터에서 카테고리나 태그 가져오기
      const urlParams = new URLSearchParams(window.location.search);
      const paramCat = urlParams.get('category');
      const paramTag = urlParams.get('tag');

      if (paramCat) {
        currentCategory = paramCat;
        categoryTabs.forEach(tab => {
          if (tab.getAttribute('data-category') === paramCat) {
            categoryTabs.forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
          }
        });
      }

      if (paramTag) {
        searchInput.value = paramTag;
        searchQuery = paramTag;
      }

      function filterAndRender() {
        let posts = BlogCore.Post.getAll();

        // 1. 카테고리 필터
        if (currentCategory !== 'all') {
          posts = posts.filter(p => p.category === currentCategory);
        }

        // 2. 검색어 필터
        if (searchQuery.trim()) {
          const q = searchQuery.toLowerCase().trim();
          posts = posts.filter(p => 
            p.title.toLowerCase().includes(q) ||
            p.summary.toLowerCase().includes(q) ||
            (p.tags && p.tags.some(t => t.toLowerCase().includes(q)))
          );
        }

        // 3. 정렬
        if (currentSort === 'latest') {
          posts.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
        } else if (currentSort === 'popular') {
          posts.sort((a, b) => (b.views || 0) - (a.views || 0));
        } else if (currentSort === 'likes') {
          posts.sort((a, b) => (b.likes || 0) - (a.likes || 0));
        }

        totalCountText.textContent = posts.length;

        // 4. 페이지네이션 계산
        const totalPages = Math.ceil(posts.length / postsPerPage) || 1;
        if (currentPage > totalPages) currentPage = 1;

        const startIndex = (currentPage - 1) * postsPerPage;
        const currentPosts = posts.slice(startIndex, startIndex + postsPerPage);

        // 5. 렌더링
        if (currentPosts.length === 0) {
          postsGrid.innerHTML = `
            <div class="empty-state" style="grid-column: 1 / -1;">
              <i class="fa-solid fa-folder-open empty-state-icon"></i>
              <h3 class="empty-state-title">검색된 게시글이 없습니다</h3>
              <p>다른 검색어를 입력하시거나 카테고리 필터를 변경해 보세요.</p>
              <button class="btn btn-outline" style="margin-top: 14px;" onclick="resetFilters()">
                <i class="fa-solid fa-rotate-left"></i> 필터 초기화
              </button>
            </div>
          `;
          paginationContainer.innerHTML = '';
          return;
        }

        postsGrid.innerHTML = currentPosts.map(post => `
          <article class="post-card">
            <a href="post-detail.html?id=${post.id}" class="post-card-thumb-wrap">
              <img src="${post.coverImage || 'https://images.unsplash.com/photo-1555066931-4365d14bab8c?q=80&w=600'}" alt="${post.title}" class="post-card-thumb" loading="lazy">
              <span class="post-card-category">${post.categoryName || post.category}</span>
            </a>
            <div class="post-card-body">
              <h3 class="post-card-title">
                <a href="post-detail.html?id=${post.id}">${post.title}</a>
              </h3>
              <p class="post-card-desc">${post.summary}</p>
              
              <div class="post-card-tags">
                ${(post.tags || []).map(t => `<a href="posts.html?tag=${encodeURIComponent(t)}" class="post-card-tag">#${t}</a>`).join('')}
              </div>

              <div class="post-card-footer">
                <div class="post-author-mini">
                  <img src="${post.authorAvatar || 'assets/images/profile.jpg'}" alt="${post.authorName}" class="author-mini-avatar">
                  <span>${post.authorName}</span>
                </div>
                <div class="post-card-stats">
                  <span title="조회수"><i class="fa-regular fa-eye"></i> ${post.views || 0}</span>
                  <span title="좋아요"><i class="fa-regular fa-heart"></i> ${post.likes || 0}</span>
                  <span title="읽는 시간"><i class="fa-regular fa-clock"></i> ${post.readTime || '3분'}</span>
                </div>
              </div>
            </div>
          </article>
        `).join('');

        // 페이지네이션 버튼 렌더링
        renderPagination(totalPages);
      }

      function renderPagination(totalPages) {
        if (totalPages <= 1) {
          paginationContainer.innerHTML = '';
          return;
        }

        let html = `
          <button class="page-btn" ${currentPage === 1 ? 'disabled' : ''} onclick="changePage(${currentPage - 1})">
            <i class="fa-solid fa-chevron-left"></i>
          </button>
        `;

        for (let i = 1; i <= totalPages; i++) {
          html += `
            <button class="page-btn ${currentPage === i ? 'active' : ''}" onclick="changePage(${i})">
              ${i}
            </button>
          `;
        }

        html += `
          <button class="page-btn" ${currentPage === totalPages ? 'disabled' : ''} onclick="changePage(${currentPage + 1})">
            <i class="fa-solid fa-chevron-right"></i>
          </button>
        `;

        paginationContainer.innerHTML = html;
      }

      window.changePage = function(page) {
        currentPage = page;
        filterAndRender();
        window.scrollTo({ top: 200, behavior: 'smooth' });
      };

      window.resetFilters = function() {
        currentCategory = 'all';
        searchQuery = '';
        searchInput.value = '';
        categoryTabs.forEach(t => t.classList.remove('active'));
        categoryTabs[0].classList.add('active');
        currentPage = 1;
        filterAndRender();
      };

      // 이벤트 리스너들
      categoryTabs.forEach(tab => {
        tab.addEventListener('click', () => {
          categoryTabs.forEach(t => t.classList.remove('active'));
          tab.classList.add('active');
          currentCategory = tab.getAttribute('data-category');
          currentPage = 1;
          filterAndRender();
        });
      });

      let debounceTimer;
      searchInput.addEventListener('input', (e) => {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => {
          searchQuery = e.target.value;
          currentPage = 1;
          filterAndRender();
        }, 250);
      });

      sortSelect.addEventListener('change', (e) => {
        currentSort = e.target.value;
        filterAndRender();
      });

      // 첫 렌더
      filterAndRender();
    });
  </script>
</body>
</html>
