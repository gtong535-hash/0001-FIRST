<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="DevLog 회원가입 - 개발자 블로그 커뮤니티에 참여하세요">
  <title>회원가입 | DevLog</title>
  
  <!-- Fonts & Icons -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ==================== Header / Navbar ==================== -->
  <header id="header" class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="nav-logo">
        <span class="logo-accent">&lt;</span>Dev.Log<span class="logo-accent">/&gt;</span>
      </a>

      <!-- Navigation Links -->
      <nav class="nav-menu" id="nav-menu">
        <ul class="nav-list">
          <li><a href="index.html" class="nav-link">홈</a></li>
          <li><a href="posts.html" class="nav-link">게시글</a></li>
          <li><a href="about.html" class="nav-link">소개</a></li>
          <li><a href="skills.html" class="nav-link">기술</a></li>
          <li><a href="projects.html" class="nav-link">프로젝트</a></li>
        </ul>
      </nav>

      <!-- Auth & Actions -->
      <div class="nav-actions">
        <div id="nav-auth-container" class="nav-auth-container">
          <!-- Dynamically populated by blog-core.js -->
        </div>
        <button id="theme-toggle" class="btn-icon" aria-label="테마 전환" title="테마 변경">
          <i class="fa-solid fa-moon"></i>
        </button>
        <button id="mobile-menu-btn" class="btn-icon hamburger" aria-label="메뉴 열기" title="메뉴 열기">
          <i class="fa-solid fa-bars"></i>
        </button>
      </div>
    </div>
  </header>

  <main class="auth-wrapper">
    <div class="auth-card" style="max-width: 520px;">
      <div class="auth-header">
        <a href="index.html" class="auth-logo">
          <span class="logo-accent">&lt;</span>Dev.Log<span class="logo-accent">/&gt;</span>
        </a>
        <h1 class="auth-title">회원가입</h1>
        <p class="auth-subtitle">DevLog의 새로운 멤버가 되어 기술 글을 작성하고 소통해 보세요.</p>
      </div>

      <form id="signup-form" class="auth-form" novalidate>
        <!-- Email -->
        <div class="form-group">
          <label for="signup-email" class="form-label">이메일 주소 <span style="color: #ef4444;">*</span></label>
          <input 
            type="email" 
            id="signup-email" 
            class="form-input" 
            placeholder="example@domain.com" 
            required 
            autocomplete="email"
          />
          <span id="signup-email-error" class="form-error"></span>
        </div>

        <!-- Nickname & Name -->
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
          <div class="form-group">
            <label for="signup-nickname" class="form-label">닉네임 <span style="color: #ef4444;">*</span></label>
            <input 
              type="text" 
              id="signup-nickname" 
              class="form-input" 
              placeholder="예: 코딩꿈나무" 
              required 
            />
            <span id="signup-nickname-error" class="form-error"></span>
          </div>
          <div class="form-group">
            <label for="signup-name" class="form-label">이름</label>
            <input 
              type="text" 
              id="signup-name" 
              class="form-input" 
              placeholder="예: 홍길동" 
            />
          </div>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label for="signup-password" class="form-label">비밀번호 <span style="color: #ef4444;">*</span></label>
          <input 
            type="password" 
            id="signup-password" 
            class="form-input" 
            placeholder="8자 이상의 영문/숫자 조합" 
            required 
            autocomplete="new-password"
          />
          <span id="signup-password-error" class="form-error"></span>
        </div>

        <!-- Confirm Password -->
        <div class="form-group">
          <label for="signup-password-confirm" class="form-label">비밀번호 확인 <span style="color: #ef4444;">*</span></label>
          <input 
            type="password" 
            id="signup-password-confirm" 
            class="form-input" 
            placeholder="비밀번호를 한 번 더 입력하세요" 
            required 
            autocomplete="new-password"
          />
          <span id="signup-password-confirm-error" class="form-error"></span>
        </div>

        <!-- Bio -->
        <div class="form-group">
          <label for="signup-bio" class="form-label">한 줄 소개</label>
          <input 
            type="text" 
            id="signup-bio" 
            class="form-input" 
            placeholder="자신을 표현하는 짧은 한 줄 소개 (예: 모던 웹 개발자)" 
          />
        </div>

        <!-- Interests Chips -->
        <div class="form-group">
          <label class="form-label">관심 기술 분야 (클릭하여 선택)</label>
          <div id="interest-chips" style="display: flex; flex-wrap: wrap; gap: 8px;">
            <button type="button" class="tag-cloud-item" data-val="React">React</button>
            <button type="button" class="tag-cloud-item" data-val="TypeScript">TypeScript</button>
            <button type="button" class="tag-cloud-item" data-val="Node.js">Node.js</button>
            <button type="button" class="tag-cloud-item" data-val="CSS & UI">CSS & UI</button>
            <button type="button" class="tag-cloud-item" data-val="알고리즘">알고리즘</button>
            <button type="button" class="tag-cloud-item" data-val="성능최적화">성능최적화</button>
          </div>
        </div>

        <div style="font-size: 0.82rem; color: var(--text-muted); line-height: 1.4;">
          가입하시면 DevLog의 이용약관 및 개인정보 처리방침에 동의하게 됩니다.
        </div>

        <button type="submit" id="btn-signup-submit" class="btn btn-primary btn-full" style="padding: 12px;">
          <i class="fa-solid fa-user-check"></i> 회원가입 완료
        </button>
      </form>

      <div class="auth-bottom-links">
        이미 계정이 있으신가요? 
        <a href="login.html">로그인하기</a>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container footer-container">
      <div class="footer-logo">
        <span class="logo-accent">&lt;</span>Dev.Log<span class="logo-accent">/&gt;</span>
      </div>
      <p class="footer-copy">&copy; 2024 DevLog. All rights reserved.</p>
    </div>
  </footer>

  <div id="toast" class="toast"></div>

  <!-- Scripts -->
  <script src="js/blog-data.js"></script>
  <script src="js/blog-core.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (BlogCore.Auth.getCurrentUser()) {
        BlogCore.showToast('이미 로그인되어 있습니다.');
        setTimeout(() => {
          window.location.href = 'profile.html';
        }, 800);
        return;
      }

      const form = document.getElementById('signup-form');
      const emailInput = document.getElementById('signup-email');
      const nicknameInput = document.getElementById('signup-nickname');
      const nameInput = document.getElementById('signup-name');
      const passwordInput = document.getElementById('signup-password');
      const confirmInput = document.getElementById('signup-password-confirm');
      const bioInput = document.getElementById('signup-bio');

      const emailError = document.getElementById('signup-email-error');
      const nicknameError = document.getElementById('signup-nickname-error');
      const passwordError = document.getElementById('signup-password-error');
      const confirmError = document.getElementById('signup-password-confirm-error');

      // Interest tags selection
      const interestChips = document.querySelectorAll('#interest-chips .tag-cloud-item');
      const selectedInterests = [];

      interestChips.forEach(chip => {
        chip.addEventListener('click', () => {
          const val = chip.getAttribute('data-val');
          chip.classList.toggle('active');
          if (chip.classList.contains('active')) {
            if (!selectedInterests.includes(val)) selectedInterests.push(val);
          } else {
            const idx = selectedInterests.indexOf(val);
            if (idx !== -1) selectedInterests.splice(idx, 1);
          }
        });
      });

      function validateEmail(email) {
        return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        // Clear errors
        [emailInput, nicknameInput, passwordInput, confirmInput].forEach(el => el.classList.remove('error'));
        emailError.textContent = '';
        nicknameError.textContent = '';
        passwordError.textContent = '';
        confirmError.textContent = '';

        let isValid = true;
        const email = emailInput.value.trim();
        const nickname = nicknameInput.value.trim();
        const password = passwordInput.value;
        const confirm = confirmInput.value;

        if (!email) {
          emailInput.classList.add('error');
          emailError.textContent = '이메일을 입력해 주세요.';
          isValid = false;
        } else if (!validateEmail(email)) {
          emailInput.classList.add('error');
          emailError.textContent = '올바른 이메일 형식이 아닙니다.';
          isValid = false;
        }

        if (!nickname) {
          nicknameInput.classList.add('error');
          nicknameError.textContent = '닉네임을 입력해 주세요.';
          isValid = false;
        } else if (nickname.length < 2) {
          nicknameInput.classList.add('error');
          nicknameError.textContent = '닉네임은 2자 이상이어야 합니다.';
          isValid = false;
        }

        if (!password) {
          passwordInput.classList.add('error');
          passwordError.textContent = '비밀번호를 입력해 주세요.';
          isValid = false;
        } else if (password.length < 6) {
          passwordInput.classList.add('error');
          passwordError.textContent = '비밀번호는 최소 6자 이상이어야 합니다.';
          isValid = false;
        }

        if (!confirm) {
          confirmInput.classList.add('error');
          confirmError.textContent = '비밀번호 확인을 입력해 주세요.';
          isValid = false;
        } else if (password !== confirm) {
          confirmInput.classList.add('error');
          confirmError.textContent = '비밀번호가 일치하지 않습니다.';
          isValid = false;
        }

        if (!isValid) return;

        const submitBtn = document.getElementById('btn-signup-submit');
        const origText = submitBtn.innerHTML;
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 회원가입 처리 중...';

        try {
          const result = await BlogCore.Auth.signup({
            email: email,
            password: password,
            nickname: nickname,
            name: nameInput.value.trim() || nickname,
            bio: bioInput.value.trim() || '안녕하세요! 개발을 사랑하는 블로거입니다.',
            interests: selectedInterests.length > 0 ? selectedInterests : ['웹 개발']
          });

          if (result.success) {
            BlogCore.showToast(`🎉 가입을 환영합니다, ${result.user.nickname}님!`, 'success');
            setTimeout(() => {
              window.location.href = 'profile.html';
            }, 800);
          } else {
            emailInput.classList.add('error');
            emailError.textContent = result.message;
            BlogCore.showToast(result.message, 'error');
            submitBtn.disabled = false;
            submitBtn.innerHTML = origText;
          }
        } catch (err) {
          submitBtn.disabled = false;
          submitBtn.innerHTML = origText;
          BlogCore.showToast('회원가입 처리 중 오류가 발생했습니다.', 'error');
        }
      });
    });
  </script>
</body>
</html>
