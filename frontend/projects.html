<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="개발자 홍길동 포트폴리오 및 프로젝트 목록">
  <title>Developer Portfolio | 프로젝트 (Projects)</title>
  
  <!-- Fonts & Icons -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ==================== Header / Navbar ==================== -->
  <header id="header" class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="nav-logo">
        <span class="logo-accent">&lt;</span>Dev.Profile<span class="logo-accent">/&gt;</span>
      </a>

      <!-- Navigation Links -->
      <nav class="nav-menu" id="nav-menu">
        <ul class="nav-list">
          <li><a href="index.html" class="nav-link">홈</a></li>
          <li><a href="about.html" class="nav-link">소개</a></li>
          <li><a href="skills.html" class="nav-link">기술</a></li>
          <li><a href="projects.html" class="nav-link active">프로젝트</a></li>
        </ul>
      </nav>

      <!-- Actions -->
      <div class="nav-actions">
        <button id="theme-toggle" class="btn-icon" aria-label="테마 전환" title="테마 변경">
          <i class="fa-solid fa-moon"></i>
        </button>
        <button id="mobile-menu-btn" class="btn-icon hamburger" aria-label="메뉴 열기" title="메뉴 열기">
          <i class="fa-solid fa-bars"></i>
        </button>
      </div>
    </div>
  </header>

  <main class="page-main">
    <!-- Page Banner -->
    <section class="page-banner">
      <div class="container">
        <span class="section-subtitle">Portfolio Showcase</span>
        <h1 class="page-title">프로젝트 포트폴리오</h1>
        <p class="page-subtitle">기획부터 UI 디자인, 프론트엔드/백엔드 구현까지 완성한 대표 작업물들입니다.</p>
      </div>
    </section>

    <!-- Projects Section -->
    <section class="section projects-section">
      <div class="container">
        <!-- Filter Controls -->
        <div class="project-filters reveal" id="project-filters">
          <button class="filter-btn active" data-filter="all">All</button>
          <button class="filter-btn" data-filter="frontend">Frontend</button>
          <button class="filter-btn" data-filter="fullstack">Fullstack</button>
          <button class="filter-btn" data-filter="javascript">Vanilla JS</button>
        </div>

        <!-- Projects Grid (Dynamically rendered via JS) -->
        <div class="projects-grid" id="projects-container">
          <!-- JavaScript will inject cards here -->
        </div>
      </div>
    </section>
  </main>

  <!-- ==================== Footer ==================== -->
  <footer class="footer">
    <div class="container footer-container">
      <div class="footer-logo">
        <span class="logo-accent">&lt;</span>Dev.Profile<span class="logo-accent">/&gt;</span>
      </div>
      <p class="footer-copy">&copy; 2026 홍길동 (Hong Gil-Dong). All rights reserved.</p>
      <div class="footer-links">
        <a href="#header" class="back-to-top" title="맨 위로 이동">
          <i class="fa-solid fa-arrow-up"></i>
        </a>
      </div>
    </div>
  </footer>

  <!-- ==================== Project Detail Modal ==================== -->
  <div id="project-modal" class="modal" aria-hidden="true" role="dialog">
    <div class="modal-overlay" id="modal-overlay"></div>
    <div class="modal-card">
      <button class="modal-close" id="modal-close" aria-label="닫기">&times;</button>
      <div class="modal-body" id="modal-body">
        <!-- Injected via JS -->
      </div>
    </div>
  </div>

  <div id="toast" class="toast" role="alert"></div>

  <!-- Scripts -->
  <script src="js/projects-data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
